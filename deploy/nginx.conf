# 静态站服务配置（HTTP）。TLS 由前置的 Nginx/Caddy/CDN 终止时使用这份。
# 若要让本容器直接处理 HTTPS，改用同目录下的 nginx.ssl.conf。
server {
    listen      80;
    server_name go.myykps.cn _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex   off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # 兼容 Drupal 7 时代的 /?q=xxx 链接：/it → /it/index.html
    # 只接受安全字符且不允许 .. ，避免路径穿越。
    if ($arg_q ~ "^(?!.*\.\.)[A-Za-z0-9_./%-]+$") {
        rewrite ^/(?:index\.php)?$ /$arg_q/index.html last;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # 隐藏文件一律不提供
    location ~ /\. {
        deny all;
    }
}
